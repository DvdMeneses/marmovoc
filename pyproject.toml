[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "marmovoc"
version = "0.2.1"
description = "Segmentação e classificação de vocalizações de saguis (a partir de marmoset_analysis)"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "soundfile",
    "pandas",
]

[project.optional-dependencies]
# Classificação com o ResNet50 do marmaudio
classificacao = ["torch", "torchvision"]
# marmovoc._vendor.marmaudio.denoise
denoise = ["noisereduce"]
dev = ["pytest"]

[project.scripts]
marmovoc = "marmovoc.cli:main"

# No Windows, o pip cria Scripts/marmovoc-gui.exe (abre sem janela de console).
[project.gui-scripts]
marmovoc-gui = "marmovoc.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
